function ProjectDetailView({ project, onBack, language }) {
  const T        = TRANSLATIONS[language];
  const metaBase = PROJECT_META[project]    || PROJECT_META['TravelAI'];
  const metaVI   = PROJECT_META_VI[project] || PROJECT_META_VI['TravelAI'];
  const meta     = language === 'VI'
    ? { ...metaBase, breadcrumb: metaVI.breadcrumb, desc: metaVI.desc }
    : metaBase;
  const tabsData = meta.tabsData;

  const tabKeys  = Object.keys(tabsData);

  const [activeSubTab, setActiveSubTab] = useState(tabKeys[0]);

  /* Stable anchor id per tab */
  const sectionId = (tabName) =>
    (project + '-' + tabName).toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');

  /* IntersectionObserver — light active tab based on scroll position */
  useEffect(() => {
    const observers = [];
    tabKeys.forEach(tabName => {
      const el = document.getElementById(sectionId(tabName));
      if (!el) return;
      const obs = new IntersectionObserver(
        ([entry]) => { if (entry.isIntersecting) setActiveSubTab(tabName); },
        { rootMargin: '-10% 0px -60% 0px', threshold: 0 }
      );
      obs.observe(el);
      observers.push(obs);
    });
    return () => observers.forEach(o => o.disconnect());
  }, [project]);

  const scrollToSection = (tabName) =>
    document.getElementById(sectionId(tabName))?.scrollIntoView({ behavior: 'smooth', block: 'start' });

  /* ── Image card ── */
  const ImgCard = ({ src, flat = false }) => (
    <div className="w-full bg-white p-4 md:p-6 shadow-sm border border-gray-100 rounded-xl flex justify-center">
      <img src={src} alt="" className={flat ? 'doc-img-flat' : 'doc-img'}
        onError={e => { e.target.closest('div').style.display = 'none'; }} />
    </div>
  );

  /* ── Section renderer (unchanged logic) ── */
  const renderSection = (section, idx, layoutType) => {
    const hasTitle = section.title && section.title.trim() !== '';

    if (layoutType === 'flat') return (
      <div key={idx} className="mb-12">
        {hasTitle && <SectionTitle title={section.title} />}
        <ImgCard src={section.images[0]} flat />
      </div>
    );

    if (layoutType === 'grid') return (
      <div key={idx} className="mb-12">
        {hasTitle && <SectionTitle title={section.title} />}
        <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 w-full">
          {section.images.map((path, j) => <ImgCard key={j} src={path} />)}
        </div>
      </div>
    );

    if (layoutType === 'figma_layered') return (
      <div key={idx} className="mb-12">
        <SectionTitle title={section.title} />
        {section.hasButtons ? (
          <>
            <div className="w-full max-w-5xl mx-auto bg-white p-4 md:p-6 shadow-sm border border-gray-100 rounded-xl flex justify-center">
              <img src={section.images[0]} alt="UX Design" className="doc-img"
                onError={e => { e.target.closest('div').style.display = 'none'; }} />
            </div>
            <div className="flex justify-center items-center gap-4 mt-6">
              {section.prototypeUrl ? (
                <a href={section.prototypeUrl} target="_blank" rel="noopener noreferrer"
                  className="bg-figmaGold text-white px-6 py-2.5 rounded-lg flex items-center gap-2 font-sans font-medium text-sm hover:brightness-110 transition-all">
                  <IcoExternalLink size={15} /> Prototype
                </a>

/* ═══════════════════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════════════════ */
function Header({ language, setLanguage }) {
  const [active, setActive] = useState('home');
  const [shadow, setShadow] = useState(false);
  const T = TRANSLATIONS[language];
  const NAV_IDS = ['home', 'about', 'skills', 'projects', 'contact'];

  useEffect(() => {
    const obs = new IntersectionObserver(
      entries => entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); }),
      { rootMargin: '-72px 0px -58% 0px', threshold: 0 }
    );
    NAV_IDS.forEach(id => { const el = document.getElementById(id); if (el) obs.observe(el); });
    const onScroll = () => setShadow(window.scrollY > 4);
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => { obs.disconnect(); window.removeEventListener('scroll', onScroll); };
  }, []);

  return (
    <header className={`fixed top-0 inset-x-0 z-50 bg-white transition-shadow duration-200 ${
      shadow ? 'shadow-[0_2px_16px_rgba(26,43,73,0.10)]' : 'border-b border-gray-100'
    }`}>
      <div className="max-w-7xl mx-auto px-10 h-[72px] flex items-center justify-between">
        <button onClick={() => goTo('home')}
          className="font-serif text-[17px] font-bold text-figmaDark tracking-[0.22em] hover:text-figmaGold transition-colors select-none">
          TRANG NHA
        </button>
        <nav className="hidden md:flex items-center gap-12">
          {NAV_IDS.map(id => (
            <button key={id} onClick={() => goTo(id)}
              className={`text-[13px] tracking-[0.09em] transition-all pb-[2px] ${
                active === id
                  ? 'text-figmaDark font-semibold border-b border-figmaDark'
                  : 'text-gray-400 font-medium hover:text-figmaDark'
              }`}>
              {T.nav[id]}
            </button>
          ))}
        </nav>
        <div className="flex items-center gap-1">
          {['VI', 'EN'].map(lang => (
            <button key={lang} onClick={() => setLanguage(lang)}
              className={`text-[11px] font-bold px-3 py-[5px] rounded tracking-[0.12em] transition-all ${
                language === lang
                  ? 'bg-figmaDark text-white'
                  : 'text-gray-400 hover:text-figmaDark'
              }`}>
              {lang}
            </button>
          ))}
        </div>
      </div>
    </header>
  );
}

/* ═══════════════════════════════════════════════════════════════

function SystemDesignDetailView({ onBack, onOpenUIUX, language }) {

  const scrollTo = id => document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });

  /* ── Per-project active section state ── */
  const [activeSec, setActiveSec] = useState({});

  const secId = (projId, label) =>
    (projId + '-' + label).toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');

  useEffect(() => {
    const observers = [];
    SD_PROJECTS.forEach(proj => {
      proj.sections.forEach(sec => {
        const el = document.getElementById(secId(proj.id, sec.label));
        if (!el) return;
        const obs = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting)
              setActiveSec(prev => ({ ...prev, [proj.id]: sec.label }));
          },
          { rootMargin: '-10% 0px -60% 0px', threshold: 0 }
        );
        obs.observe(el);
        observers.push(obs);
      });
    });
    return () => observers.forEach(o => o.disconnect());
  }, []);

  const scrollToSec = (projId, label) =>
    document.getElementById(secId(projId, label))?.scrollIntoView({ behavior: 'smooth', block: 'start' });

  /* ── Image card ── */
  const ImgCard = ({ src, flat = false }) => (
    <div className="w-full bg-white rounded-xl border border-gray-100 shadow-sm p-3 md:p-5 flex justify-center">
      <img src={src} alt=""
        className={flat ? 'doc-img-flat' : 'doc-img'}
        onError={e => { e.target.closest('div').style.display = 'none'; }} />
    </div>
  );

  /* ── Section block ── */
  const DocSection = ({ sec }) => {
    const { label, type, images } = sec;
    return (
      <div className="mb-10">
        {/* Centered section divider */}
        <SectionDivider label={label} />

        {type === 'flat' && <ImgCard src={images[0]} flat />}

        {type === 'centered' && (
          <div className="w-full max-w-4xl mx-auto">
            <ImgCard src={images[0]} />
          </div>
        )}

        {type === 'mobile' && (
          <div className="w-full max-w-sm mx-auto">
            <ImgCard src={images[0]} />
          </div>
        )}

        {type === 'grid' && (
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-5">
            {images.map((src, j) => <ImgCard key={j} src={src} />)}
          </div>
        )}

        {/* Description text block */}
        {type === 'text' && (
          <div className="bg-white rounded-xl border border-gray-100 shadow-sm px-8 py-6">
            <p className="font-sans text-gray-600 text-[14px] leading-[1.95]">{sec.content}</p>
          </div>
        )}

        {/* Scope golden box */}
        {type === 'scope' && (
          <div className="bg-figmaGold/10 border border-figmaGold/30 rounded-2xl p-8 my-2 text-center max-w-4xl mx-auto">
            <p className="font-sans text-figmaDark text-[13.5px] leading-[1.85] mb-6">{sec.scopeText}</p>
            <span className="inline-block bg-figmaGold text-white font-sans font-semibold text-sm px-6 py-2 rounded-full">
              {sec.scopeBadge}
            </span>
          </div>
        )}

        {/* BPMN modules: one header + multiple sub-labeled flat images */}
        {type === 'flat-modules' && (
          <div className="flex flex-col gap-8">

  const secId = (projId, label) =>
    (projId + '-' + label).toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');

  useEffect(() => {
    const observers = [];
    UX_PROJECTS.forEach(proj => {
      proj.sections.forEach(sec => {
        const el = document.getElementById(secId(proj.id, sec.label));
        if (!el) return;
        const obs = new IntersectionObserver(
          ([entry]) => {
            if (entry.isIntersecting)
              setActiveSec(prev => ({ ...prev, [proj.id]: sec.label }));
          },
          { rootMargin: '-10% 0px -60% 0px', threshold: 0 }
        );
        obs.observe(el);
        observers.push(obs);
      });
    });
    return () => observers.forEach(o => o.disconnect());

        <div className="bg-figmaGold/5 border border-figmaGold/20 rounded-2xl p-6 my-6 text-center max-w-2xl mx-auto shadow-sm">
          <span className="text-figmaGold font-sans text-sm md:text-base font-bold tracking-widest uppercase mb-3 block text-center">PROJECT</span>
          <span className="bg-figmaGold/30 text-figmaDark font-sans font-semibold text-sm px-6 py-2.5 rounded-full inline-flex items-center gap-2 mt-2">
            🤖 {language === 'VI' ? 'TravelAI – Agentic AI Chatbot Lập Kế Hoạch Du Lịch' : 'TravelAI – Agentic AI Travel Planning Chatbot'}
          </span>
        </div>
      </div>

      {/* ── Long-scroll content ── */}
      <div className="flex-1 py-6 px-8">
        <div className="max-w-6xl mx-auto">

          <DocSection label="MULTI-AGENT SYSTEM ARCHITECTURE" src="./vibecoding/eng1.png" />
          <DocSection label="MY VIBE CODING WORKFLOW"         src="./vibecoding/eng2.png" />

          {/* ── Footer navigation ── */}
          <div className="flex justify-between items-center w-full max-w-6xl mx-auto px-4 py-12 mt-12 border-t border-gray-100 bg-transparent">
            <button onClick={onOpenUIUX}
              className="bg-figmaDark text-white font-sans font-medium text-sm px-6 py-3 rounded-xl flex items-center gap-2 hover:opacity-90 active:scale-95 transition-all shadow-sm cursor-pointer select-none">
              <IcoBack size={14} /> UI/UX DESIGN
            </button>
            <button onClick={onBack}
              className="bg-figmaDark text-white font-sans font-medium text-sm px-6 py-3 rounded-xl flex items-center gap-2 hover:opacity-90 active:scale-95 transition-all shadow-sm cursor-pointer select-none">
              {language === 'VI' ? 'Về Trang Chủ' : 'Back To Home'} <IcoArrow size={14} />
            </button>
          </div>

        </div>
      </div>

    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════════════════ */
function App() {
  const [selectedProject,      setSelectedProject]      = useState(null);
  const [showSystemDesign,     setShowSystemDesign]     = useState(false);
  const [showUIUXDesign,       setShowUIUXDesign]       = useState(false);
  const [showVibeCoding,       setShowVibeCoding]       = useState(false);
  const [language,             setLanguage]             = useState('EN');
  const [isScrollToTopVisible, setIsScrollToTopVisible] = useState(false);

  useEffect(() => {
    if (selectedProject || showSystemDesign || showUIUXDesign || showVibeCoding) window.scrollTo({ top: 0, behavior: 'smooth' });
  }, [selectedProject, showSystemDesign, showUIUXDesign, showVibeCoding]);

  useEffect(() => {
    const onScroll = () => setIsScrollToTopVisible(window.scrollY > 300);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  const scrollToTop = () => window.scrollTo({ top: 0, behavior: 'smooth' });

  let view;
  if (showSystemDesign) {
    view = (
      <SystemDesignDetailView
        language={language}
        onBack={() => { setShowSystemDesign(false); setTimeout(() => goTo('skills'), 80); }}
        onOpenUIUX={() => { setShowSystemDesign(false); setShowUIUXDesign(true); window.scrollTo(0, 0); }}
      />
    );
  } else if (showUIUXDesign) {
    view = (
      <UIUXDesignDetailView
        language={language}
        onBack={() => { setShowUIUXDesign(false); setTimeout(() => goTo('skills'), 80); }}
        onOpenSystemDesign={() => { setShowUIUXDesign(false); setShowSystemDesign(true); window.scrollTo(0, 0); }}
        onOpenVibeCoding={() => { setShowUIUXDesign(false); setShowVibeCoding(true); window.scrollTo(0, 0); }}
      />
    );
  } else if (showVibeCoding) {
    view = (
      <VibeCodingDetailView
        language={language}
        onBack={() => { setShowVibeCoding(false); setTimeout(() => goTo('skills'), 80); }}
        onOpenUIUX={() => { setShowVibeCoding(false); setShowUIUXDesign(true); window.scrollTo(0, 0); }}
      />
    );
  } else if (selectedProject) {
    view = (
      <ProjectDetailView
        project={selectedProject}
        language={language}
        onBack={() => {
          setSelectedProject(null);
          setTimeout(() => goTo('projects'), 80);
        }}
      />
    );
  } else {
    view = (
      <div className="font-sans">
        <Header language={language} setLanguage={setLanguage} />
        <main>
          <HomeSection   language={language} />
          <AboutSection  language={language} />
          <SkillsSection language={language} onOpenSystemDesign={() => setShowSystemDesign(true)} onOpenUIUXDesign={() => setShowUIUXDesign(true)} onOpenVibeCoding={() => setShowVibeCoding(true)} />
          <ProjectsSection language={language} onOpenProject={setSelectedProject} />
          <ContactSection  language={language} />
        </main>
        <Footer language={language} />
      </div>
    );
  }

  return (
    <React.Fragment>
      {view}
      {isScrollToTopVisible && (
        <button
          onClick={scrollToTop}
          className="fixed bottom-8 right-8 z-50 bg-figmaDark text-figmaGold border border-gray-700/40 w-12 h-12 rounded-full flex items-center justify-center shadow-lg shadow-black/20 hover:scale-110 active:scale-95 transition-all duration-300 cursor-pointer"
          aria-label="Scroll to top"
        >
          <IcoChevronUp size={20} className="stroke-[2.5]" />
        </button>
      )}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
